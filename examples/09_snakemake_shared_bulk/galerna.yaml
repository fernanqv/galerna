output_dir: "runs"
mode: "one_by_one"

cases:
  layout: shared
  id_format: "case_{{ '%04d' | format(case_num) }}"

variable_parameters:
  station: [401, 402, 403, 404]
  sleep_seconds: [2, 2, 2, 2]

command: "python -c 'from pathlib import Path; import time; print(\"START {{case_id}} station={{station}}\", flush=True); time.sleep({{sleep_seconds}}); Path(\"result_{{case_id}}.txt\").write_text(\"case_id={{case_id}}\\nstation={{station}}\\n\"); print(\"DONE {{case_id}}\", flush=True)'"

run:
  backend: snakemake
  mode: bulk
  executor: local
  tasks_per_job: 2
  cpus_per_task: 2
  cores: 2
