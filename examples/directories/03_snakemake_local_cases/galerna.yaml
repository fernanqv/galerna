output_dir: "runs"
mode: "one_by_one"

cases:
  layout: directories
  id_format: "case_{{ '%04d' | format(case_num) }}"

variable_parameters:
  station: [101, 102, 103, 104]
  sleep_seconds: [1, 1, 1, 1]

command: "python -c 'from pathlib import Path; import time; print(\"START {{case_id}} station={{station}}\", flush=True); time.sleep({{sleep_seconds}}); Path(\"result_{{case_id}}.txt\").write_text(\"station={{station}}\\n\"); print(\"DONE {{case_id}}\", flush=True)'"

run:
  backend: snakemake
  mode: cases
  executor: local
  snakemake:
    cli:
      cores: 2
