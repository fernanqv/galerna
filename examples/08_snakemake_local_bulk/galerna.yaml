templates_dir: "templates"
output_dir: "runs"
mode: "one_by_one"

cases:
  layout: directories
  id_format: "case_{{ '%04d' | format(case_num) }}"

variable_parameters:
  station: [301, 302, 303, 304]
  sleep_seconds: [2, 2, 2, 2]

command: "python run_case.py"

run:
  backend: snakemake
  mode: bulk
  executor: local
  tasks_per_job: 2
  cpus_per_task: 2
  cores: 2
