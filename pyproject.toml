[build-system]
requires = ["setuptools>=60"]
build-backend = "setuptools.build_meta"

[project]
name = "galerna"
version = "0.1.0"
description = "Minimal numerical model wrappers infrastructure."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
requires-python = ">=3.10"
dependencies = [
    "jinja2",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
workflow = [
    "snakemake",
    "snakemake-executor-plugin-slurm",
]

[project.scripts]
galerna = "galerna.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["galerna*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
