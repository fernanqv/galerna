output_dir: "runs"
mode: "one_by_one"

cases:
  layout: shared
  id_format: "case_{{ '%04d' | format(case_num) }}"

variable_parameters:
  station: range(1,101)
  sleep_seconds: range(1,101)

command: "python -c 'from pathlib import Path; import socket; import time; print(\"START {{case_id}} station={{station}} host=\" + socket.gethostname(), flush=True); time.sleep({{sleep_seconds}}); Path(\"result_{{case_id}}.txt\").write_text(\"case_id={{case_id}}\\nstation={{station}}\\nhost=\" + socket.gethostname() + \"\\n\"); print(\"DONE {{case_id}}\", flush=True)'"

run:
  backend: snakemake
  mode: bulk
  executor: slurm
  cases_per_job: 16
  snakemake:
    rule:
      threads: 16
      resources:
        runtime: 10
        mem_mb: 1000
        slurm_partition: "meteo_long"
