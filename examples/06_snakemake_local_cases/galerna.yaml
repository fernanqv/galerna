templates_dir: "templates"
output_dir: "runs"
mode: "one_by_one"

cases:
  layout: directories
  id_format: "case_{{ '%04d' | format(case_num) }}"

variable_parameters:
  station: [101, 102, 103, 104]
  sleep_seconds: [2, 2, 2, 2]

command: "python run_case.py"

run:
  backend: snakemake
  mode: cases
  executor: local
  cores: 2
